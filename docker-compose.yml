services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SGLANG_BASE_URL: ${SGLANG_BASE_URL:-http://sglang:30000/v1}
      SGLANG_MODEL: ${SGLANG_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      SGLANG_API_KEY: ${SGLANG_API_KEY:-EMPTY}
      SGLANG_TIMEOUT_SECONDS: ${SGLANG_TIMEOUT_SECONDS:-120}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}

  # Only runs on a Linux host with an NVIDIA GPU + NVIDIA Container Toolkit.
  # Start explicitly with: docker compose --profile gpu up sglang
  # `docker compose up app` (no profile) never starts this service.
  sglang:
    image: lmsysorg/sglang:latest
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      - "30000:30000"
    ipc: host
    command: >
      python3 -m sglang.launch_server
      --model-path Qwen/Qwen2.5-VL-7B-Instruct
      --host 0.0.0.0 --port 30000
    volumes:
      - sglang-hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

volumes:
  sglang-hf-cache:
